version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: rhuser
      POSTGRES_PASSWORD: rhpass
      POSTGRES_DB: rh_finance
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://rhuser:rhpass@db:5432/rh_finance
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'

volumes:
  db_data:
